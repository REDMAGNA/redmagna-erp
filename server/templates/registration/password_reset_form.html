<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña · ERP Redmagna</title>
  <style>body{font:16px system-ui,sans-serif;color:#263445;background:#f3f6f9;margin:0;padding:24px}.card{max-width:460px;margin:8vh auto;background:#fff;padding:32px;border-radius:12px;box-shadow:0 8px 30px #18334d14}h1{font-size:24px}p{line-height:1.55;color:#5c6877}label{display:block;margin:20px 0 6px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd4dd;border-radius:6px;font:inherit}button{margin-top:20px;padding:11px 16px;border:0;border-radius:6px;background:#1769aa;color:white;font:inherit;cursor:pointer}a{color:#1769aa}.errorlist{color:#a32626}</style>
</head>
<body><main class="card">
  <h1>Recuperar contraseña</h1>
  <p>Escribe el correo asociado a tu usuario. Si corresponde a una cuenta activa, enviaremos instrucciones para crear una contraseña nueva.</p>
  <form method="post">{% csrf_token %}
    {{ form.email.errors }}
    <label for="id_email">Correo electrónico</label>
    {{ form.email }}
    <button type="submit">Enviar instrucciones</button>
  </form>
  <p><a href="/">Volver al ERP</a></p>
</main></body>
</html>
